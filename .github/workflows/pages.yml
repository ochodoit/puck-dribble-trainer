# GitHub Pages 자동 배포: 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 설정하면
# main 브랜치에 푸시할 때마다 https://<계정>.github.io/<저장소>/ 에 배포됩니다. (HTTPS라 휴대폰 카메라 사용 가능)
# 배포 전에 Firestore 보안 규칙(firestore.rules)을 먼저 게시합니다 (아래 rules 작업, docs/firebase-setup.md 4번)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) Firestore 보안 규칙 게시: 저장소의 firestore.rules -> headsuppuck 프로젝트.
  #    새 게임이 새 규칙을 기대하므로 사이트보다 먼저 하고, 게시가 실패하면 사이트도 배포하지 않는다.
  #    내용이 이미 같으면 firebase-tools 가 올리지 않고 넘어간다. 콘솔에서 직접 고친 규칙은 저장소 내용으로 덮어써진다.
  #    필요한 시크릿: FIREBASE_SERVICE_ACCOUNT (규칙 게시 전용 서비스 계정의 JSON 키,
  #    역할은 'Firebase Rules 관리자' + '서비스 사용량 소비자' 두 개만). 없으면 경고만 남기고 넘어간다.
  rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy firestore.rules
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::warning title=Firestore 규칙 게시 안 함::FIREBASE_SERVICE_ACCOUNT 시크릿이 없어 규칙을 게시하지 않았습니다. firestore.rules 가 바뀌었으면 콘솔에서 직접 게시하세요 (docs/firebase-setup.md 4번)"
            exit 0
          fi
          key="$RUNNER_TEMP/firebase-sa.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SA" > "$key"
          node --version
          GOOGLE_APPLICATION_CREDENTIALS="$key" npx --yes firebase-tools@15.35.0 deploy --only firestore:rules --project headsuppuck --non-interactive

  # 2) 사이트 배포 (규칙 게시가 끝난 뒤)
  deploy:
    needs: rules
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url || steps.deploy4.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html favicon.ico style.css manifest.webmanifest src icons cam _site/
          # 검색엔진·AI 검색용 (tools/build-site.mjs 로 만든 파일): 영어 첫 화면, 안내 페이지, 사이트맵 등
          cp -r en guide games faq compare pages.css robots.txt sitemap.xml rss.xml llms.txt 404.html google3d8a4c89a20c8fb9.html adc596214f1816d3cd9de83acad9a56b.txt _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      # 올린 직후 deploy-pages 가 아티팩트를 찾으면 GitHub 쪽 목록에 아직 안 보여
      # 'No artifacts named "github-pages" were found' 로 가끔 실패한다 (actions/deploy-pages#451, 2026-11 부터 잦음).
      # 기다렸다가 같은 작업 안에서 다시 시도한다 (10초 → 30초 → 60초). 성공하면 뒤 단계는 건너뛴다.
      # 실패한 실행을 GitHub 화면에서 'Re-run' 하면 아티팩트가 두 개가 돼 또 실패하니,
      # 끝내 실패하면 Actions > Deploy to GitHub Pages > Run workflow 로 새로 돌린다.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 10
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - if: steps.deploy2.outcome == 'failure'
        run: sleep 30
      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - if: steps.deploy3.outcome == 'failure'
        run: sleep 60
      - id: deploy4
        if: steps.deploy3.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # 3) IndexNow: 사이트 배포가 끝나면 이번에 바뀐 페이지(index.html, guide/index.html …) 주소를 네이버·Bing 에 바로 알린다
  #    (tools/indexnow.mjs, 키 파일은 위에서 같이 배포). 손으로 돌리면(workflow_dispatch) 모든 페이지를 알린다.
  #    알림이 실패해도 사이트는 이미 배포됐으므로 경고만 남긴다
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node tools/indexnow.mjs --all
          else
            node tools/indexnow.mjs $(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi
