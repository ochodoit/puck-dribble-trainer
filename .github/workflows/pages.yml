# GitHub Pages 자동 배포: 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 설정하면
# main 브랜치에 푸시할 때마다 https://<계정>.github.io/<저장소>/ 에 배포됩니다. (HTTPS라 휴대폰 카메라 사용 가능)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html style.css manifest.webmanifest src icons _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
