<!doctype html>
<html><head><meta charset="utf-8"><title>vision harness</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght,SOFT@9..144,600..900,0..100&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
<canvas id="scene" width="640" height="480"></canvas>
<canvas id="arcade" width="1280" height="720"></canvas>
<script type="module">
  import { Vision, AutoCalibrator, colorsTooClose, colorDist, liftComp, matchDistance, makeMatcher, matchPixel, shadowCut } from '../src/vision.js';
  import { chooseTolerance, falseBlobs, chooseProcWidth, needFromTest, preferLowRate } from '../src/autotune.js';
  import { Tracker } from '../src/tracker.js';
  import { StickBridge } from '../src/occlusion.js';
  import { placementCheck } from '../src/placement.js';
  import { Game } from '../src/game.js';
  import { sanitizeSettings, DEFAULT_SETTINGS } from '../src/storage.js';
  import { CameraRateAuto } from '../src/camera.js';
  import { linkStep, linkSample, newLinkState, LINK_LEVELS } from '../src/remote-cam.js';
  import { Arcade, PUCK_R, HIT_PENALTY, TOUCH_POINTS, COIN_POINTS, SCORE_MULT, FIELD_MARGIN, PUCK_COLORS, FALL_R, COIN_R } from '../src/arcade.js';
  import { C } from '../src/theme.js';
  import { alphaLayer } from '../src/theme.js';
  import { rankKey, FLYER_R, WIDE_DRILLS, WIDE_HOLD_R, laneX, figure8Waypoints, FIGURE8_DIRS, GATE_DRAW_R, TARGET_DRAW_R, PUCK_R as ME_R, HIT_OVERLAP, circleOverlap, overlapReach, discRectOverlap, scoreScale, shownScore } from '../src/game.js';
  import { FLOOR_MODES, FLOOR_FLIP_MODES } from '../src/render.js';
  import { makeFloorMapping } from '../src/geometry.js';
  import { memberStats, lastDays } from '../src/stats.js';
  import { analyticsAllowed, initAnalytics, track, GA_ID } from '../src/analytics.js';
  import { LocalAccountStore, ageGroupOf, validateProfile, jerseyOf, hashPin, normCode, codeLabel, makeCode, CODE_CHARS, codeStatus, memberBadge, rankAmong, instaId, instaDmLink, betaState, isActiveMember, validateFeedback, LAPSED, RESERVED_NICK_RE, validateStrongPassword, rankSummaryOf, validateEdit, addMonths, couponUntil, lotteryPool, drawLottery, INVITE_MAX, codeInfo, SAME_PW_MSG, NEED_TEMP_MSG } from '../src/account.js';
  // 계정 테스트 도우미 (아이디 + 비밀번호 로그인): 별명 -> 아이디(u + 별명의 hex), 예전 숫자 6자리 -> 비밀번호(pw + 숫자)
  const ID = (nick) => ('u' + [...new TextEncoder().encode(String(nick).trim().toLowerCase())].map((b) => b.toString(16).padStart(2, '0')).join('')).slice(0, 20);
  const PW = (pin) => `pw${pin}`;
  import { addActivity, cleanActivity, streak, attendanceSummary, monthGrid, keyInfo, dayKey, sparkPoints, RECENT_MAX } from '../src/activity.js';
  import { siteAllowed, isDevHost, OFFICIAL_URL } from '../src/guard.js';
  import { decideIdle, stepChoice, stepDwell, choiceSide, inCardCore, CARD_INSET, CHOICE_HOLD_S } from '../src/idle-logic.js';
  import { LocalCommunityStore, buildPost, boardOf, courseSig, betterRecord, STARTER_POSTS } from '../src/community.js';
  import { timeAgo, courseSvg } from '../src/community-ui.js';
  import { tr, setLang, getLang, detectLang, initI18n } from '../src/i18n.js';

  const scene = document.getElementById('scene');
  const sctx = scene.getContext('2d');

  // 합성 장면: 회색 배경 + 흰 바닥 사각형(원근) + 검정 퍽 + 주황 스틱 블레이드 + 어두운 신발(노이즈)
  function drawScene({ puck, stick, shoe, distractor, stickShade = 1, glare = false }) {
    sctx.fillStyle = '#6b7280'; sctx.fillRect(0, 0, 640, 480);
    sctx.fillStyle = '#f3f4f6';
    sctx.beginPath(); sctx.moveTo(120, 120); sctx.lineTo(520, 120); sctx.lineTo(600, 440); sctx.lineTo(40, 440); sctx.closePath(); sctx.fill();
    // 바닥 음영
    sctx.fillStyle = 'rgba(0,0,0,0.08)'; sctx.fillRect(40, 300, 560, 140);
    if (shoe) { sctx.fillStyle = '#1f2937'; sctx.fillRect(shoe.x, shoe.y, 60, 28); }
    if (distractor) { sctx.fillStyle = '#111827'; sctx.beginPath(); sctx.ellipse(distractor.x, distractor.y, distractor.rx || 14, distractor.ry || 9, 0, 0, Math.PI * 2); sctx.fill(); }
    if (stick) {
      const sh = Math.round(249 * stickShade), sg = Math.round(115 * stickShade), sb = Math.round(22 * stickShade);
      sctx.strokeStyle = `rgb(${sh},${sg},${sb})`; sctx.lineWidth = 10; sctx.lineCap = 'round';
      sctx.beginPath(); sctx.moveTo(stick.x, stick.y); sctx.lineTo(stick.x + 40, stick.y - 6); sctx.stroke();
    }
    if (puck) {
      sctx.fillStyle = '#111827'; sctx.beginPath(); sctx.ellipse(puck.x, puck.y, 14, 9, 0, 0, Math.PI * 2); sctx.fill();
      if (glare) { sctx.fillStyle = '#e5e7eb'; sctx.fillRect(puck.x - 1, puck.y - 10, 3, 20); } // 반사광으로 퍽이 둘로 갈라짐
    }
  }

  const settings = {
    whiteV: 150, whiteC: 55, puckTol: 95, stickTol: 70,
    puckModel: { r: 0, g: 0, b: 0, area: 0 }, stickModel: null,
    floorMode: 'auto', manualQuad: null, debug: false,
  };

  // 아케이드 화면 데모 (스크린샷 확인용)
  window.renderArcadeDemo = () => {
    const cv = document.getElementById('arcade'); const ctx = cv.getContext('2d');
    ctx.fillStyle = '#6b7280'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#e5e7eb'; ctx.fillRect(120, 300, 1040, 420);
    const ar = new Arcade(null); ar.aspect = cv.height / cv.width; ar.start({ distance: 0 }, 'normal'); ar.phase = 'play';
    ar.score = 183; ar.streak = 12; ar.maxStreak = 12; ar.level = 1;
    ar.avatar = ar.toZone(0.42, 0.55);
    const P = (x, y, r, c) => ar.obstacles.push({ x, y, r, vy: 0.26, color: PUCK_COLORS[c], minDist: 1, passed: false, hit: false, nearMiss: false });
    P(0.22, 0.10, 0.020, 0); P(0.58, 0.05, 0.015, 1); P(0.82, 0.19, 0.018, 2); P(0.36, 0.27, 0.014, 3); P(0.68, 0.33, 0.021, 0); P(0.14, 0.36, 0.016, 1); P(0.50, 0.40, 0.017, 2); P(0.30, 0.46, 0.019, 3); P(0.88, 0.42, 0.015, 0); P(0.46, 0.16, 0.02, 2);
    ar.pickups.push({ x: 0.75, y: 0.44, r: 0.013, vy: 0.3, born: 0 }); ar.pickups.push({ x: 0.2, y: 0.22, r: 0.013, vy: 0.3, born: 0 });
    ar.effects.push({ type: 'pop', x: 0.42, y: ar.avatar.y - 0.09, text: '+10', color: '#5A564E', style: 'small', t0: performance.now(), dur: 900, age: 0.2 });
    ar.draw(ctx, cv.width, cv.height, 1234, { trail: [], state: 'tracked' });
    return true;
  };

  window.runTests = async () => {
    const out = { ok: true, logs: [], errors: [] };
    const check = (name, cond, detail) => { out.logs.push(`${cond ? 'PASS' : 'FAIL'} ${name}${detail ? ' ' + JSON.stringify(detail) : ''}`); if (!cond) out.ok = false; };

    const vision = new Vision(240);
    vision.mirror = false;
    vision.setSourceSize(640, 480);

    // 1) 바닥 + 퍽 감지 (여러 프레임 돌려 EMA 안정화)
    drawScene({ puck: { x: 320, y: 300 }, stick: null, shoe: null });
    let r;
    for (let i = 0; i < 12; i++) r = vision.process(scene, settings);
    check('floor detected', r.floor.detected && !!r.floor.mapping);
    const q = r.floor.quad;
    check('floor quad plausible (trapezoid)', q && q[3][0] < 240 * 0.12 && q[2][0] > 240 * 0.85 && q[0][0] > q[3][0] && q[1][0] < q[2][0] && q[0][1] > 240 * 0.2 * 0.75 && q[2][1] > 240 * 0.68, q);
    check('puck detected', !!r.puck, r.puck);
    // 퍽 위치: 640x480 -> 240x180 배율 0.375
    check('puck position', r.puck && Math.abs(r.puck.x - 320 * 0.375) < 2 && Math.abs(r.puck.y - 300 * 0.375) < 2, r.puck && [r.puck.x, r.puck.y]);

    // 2) 스틱 보정 (주황 테이프 터치) + 추적
    drawScene({ puck: { x: 300, y: 320 }, stick: { x: 340, y: 300 }, shoe: null });
    r = vision.process(scene, settings);
    const sample = vision.sampleObject(360 * 0.375, 297 * 0.375, settings.stickTol);
    check('stick sample is orange', sample && sample.r > 200 && sample.g > 80 && sample.g < 160 && sample.b < 80, sample);
    check('stick sample not floor-like', sample && !vision.isFloorLike(sample, settings));
    settings.stickModel = { ...sample };
    r = vision.process(scene, settings);
    check('stick detected', !!r.stick, r.stick);
    check('stick position', r.stick && Math.abs(r.stick.x - 360 * 0.375) < 4 && Math.abs(r.stick.y - 297 * 0.375) < 4, r.stick && [r.stick.x, r.stick.y]);
    check('puck still detected with stick', !!r.puck && Math.abs(r.puck.x - 300 * 0.375) < 2, r.puck);

    // 3) 퍽 보정 (검정 퍽 터치) -> 면적 학습
    const ps = vision.sampleObject(300 * 0.375, 320 * 0.375, settings.puckTol);
    check('puck sample dark', ps && ps.r < 40 && ps.area > 10 && ps.area < 120, ps);
    settings.puckModel = { ...ps };

    // 4) 큰 어두운 물체(신발)가 있어도 퍽 선택
    drawScene({ puck: { x: 420, y: 350 }, stick: { x: 340, y: 300 }, shoe: { x: 200, y: 380 } });
    r = vision.process(scene, settings);
    check('puck chosen over shoe', r.puck && Math.abs(r.puck.x - 420 * 0.375) < 2, { puck: r.puck && [r.puck.x, r.puck.y], cands: r.puckCandidates.map((c) => [c.area, +c.score.toFixed(2)]) });

    // 5) 흰색 샘플은 거부
    const ws = vision.sampleObject(320 * 0.375, 200 * 0.375, 70);
    check('white sample flagged floor-like', ws && vision.isFloorLike(ws, settings), ws);

    // 6) 트래커 + 게임: 퍽이 좌우로 움직이면 터치 카운트 증가, 와이드 모드는 평면 위에서 내 퍽을 따라감
    const tracker = new Tracker();
    const game = new Game(null);
    game.setMode('wide');
    let now = 1000;
    for (let i = 0; i < 10; i++) { drawScene({ puck: { x: 320, y: 300 } }); r = vision.process(scene, settings); const [u, v] = r.floor.mapping.toUV(r.puck.x, r.puck.y); tracker.update({ u, v }, now); now += 33; }
    game.start(tracker);
    let lastU = null;
    // 훈련 시작 전: 퍽을 경기장 한가운데(가운데 동그라미)에 3초 넘게 둔다
    const mid = (() => { const [px, py] = r.floor.mapping.toPx(0.5, 0.5); return { x: px / 0.375, y: py / 0.375 }; })();
    for (let t = 0; t < 100; t++) {
      drawScene({ puck: mid });
      r = vision.process(scene, settings);
      if (r.puck) { const [u, v] = r.floor.mapping.toUV(r.puck.x, r.puck.y); tracker.update({ u, v }, now); } else tracker.update(null, now);
      game.update(0.033, tracker, now);
      now += 33;
    }
    check('wide drill starts after the puck sits in the middle for 3 s', game.wide.hold === null && game.elapsed < 0.4, { hold: game.wide.hold, elapsed: game.elapsed, me: game.me });
    for (let t = 0; t < 240; t++) {
      const x = 320 + Math.sin(t / 8) * 230;  // 좌우 왕복 (약 1.65초 주기)
      drawScene({ puck: { x, y: 300 } });
      r = vision.process(scene, settings);
      let meas = null;
      if (r.puck) { const [u, v] = r.floor.mapping.toUV(r.puck.x, r.puck.y); meas = { u, v }; lastU = u; }
      tracker.update(meas, now);
      game.update(0.033, tracker, now);
      now += 33;
    }
    check('tracker counts touches', tracker.touches >= 6, { touches: tracker.touches, lastU });
    check('wide drill follows my puck on the flat field', game.me && game.me.x > 0 && game.me.x < 1 && game.wide.stage === 0, game.me);
    check('timer runs down (3 drills x 1 min)', game.limit === 180 && game.timeLeft < 180 && game.timeLeft > 170 && Math.abs(game.stageLeft - (game.timeLeft - 120)) < 1e-6, { left: game.timeLeft, stageLeft: game.stageLeft });
    const result = game.stop('manual');
    check('result built', result && result.items.length >= 2, result && result.items);

    // 7) 퍽 피하기 서바이벌: 사방에서 직선으로 날아오는 빨간 퍽, 개수 증가, 충돌/무적, 회피 카운트
    game.setMode('obstacle');
    game.difficulty = 'normal';
    const tr7 = { pos: { x: 0.5, y: 0.5 }, state: 'tracked', touches: 0, distance: 0, speed: 0, frames: 10, trackedFrames: 10, trackRate: 1 };
    let t7 = 100000;
    game.start(tr7);
    for (let i = 0; i < 60; i++) { game.update(0.033, tr7, t7); t7 += 33; } // 2초
    const early = game.stats.maxFlyers;
    check('flyers spawned from the four sides', game.flyers.length >= 1 && game.flyers.every((f) => f.side >= 0 && f.side <= 3), game.flyers.length);
    const f0 = game.flyers[0];
    const dir0 = Math.atan2(f0.vy, f0.vx), sp0 = Math.hypot(f0.vx, f0.vy);
    check('flyer speed within difficulty range', sp0 >= 0.25 - 1e-9 && sp0 <= 0.85 + 1e-9, sp0);
    check('flyer radius halved (0.0175)', FLYER_R === 0.0175);
    {
      const gs = new Game(null); gs.setMode('obstacle'); const sps = [];
      for (let i = 0; i < 300; i++) { gs.flyers = []; const fl = gs._spawnFlyer({ x: 0.5, y: 0.5 }, { flyMin: 0.25, flyMax: 0.85 }, 0); if (fl) sps.push(fl.speed); }
      const mn = Math.min(...sps), mx = Math.max(...sps);
      check('flyer speeds are random per puck across the range', mn < 0.35 && mx > 0.75 && new Set(sps.map((v) => v.toFixed(3))).size > 100, { mn, mx });
    }
    const x1 = f0.x, y1 = f0.y;
    for (let i = 0; i < 10; i++) { game.update(0.033, tr7, t7); t7 += 33; }
    const moved = Math.atan2(f0.y - y1, f0.x - x1);
    check('flyer travels in a straight line at constant speed', Math.abs(moved - dir0) < 1e-6 && Math.abs(Math.hypot(f0.vx, f0.vy) - sp0) < 1e-9, { dir0, moved });
    // 20초 경과 -> 동시 퍽 수 증가 (normal: 2 + floor(20/9) = 4)
    tr7.state = 'predicted'; // 피격 없이 시간만 흐르게
    for (let i = 0; i < 600; i++) { game.update(0.033, tr7, t7); t7 += 33; }
    check('flyer count grows over time', game.stats.maxFlyers >= 4 && game.stats.maxFlyers > early, { early, max: game.stats.maxFlyers });
    check('dodged pucks are counted', game.stats.dodged > 0 && game.score >= 200, { dodged: game.stats.dodged, score: game.score });
    // 충돌: 플레이어를 날아오는 퍽 위에 둠 (앞 구간의 우연한 충돌 영향을 없애기 위해 상태 초기화)
    tr7.state = 'tracked'; game.lives = 3; game.stats.hits = 0; game.invulnUntil = 0;
    const fl = game.flyers.find((f) => t7 >= f.launchAt) || game.flyers[0];
    fl.launchAt = 0; fl.hit = false; tr7.pos = { x: fl.x, y: fl.y };
    game.update(0.033, tr7, t7); t7 += 33;
    check('flyer hit is a penalty, not a life', game.stats.hits === 1 && game.hits === 0 + 0 || game.stats.hits === 1, { hits: game.stats.hits });
    const scoreAfterHit = (game.update(0.001, { ...tr7, state: 'predicted' }, t7), game.score);
    check('flyer hit subtracts 50 points', scoreAfterHit === Math.max(0, Math.floor(game.elapsed) * 10 + game.stats.dodged * 5 + game.stats.close * 15 - 50), scoreAfterHit);
    const fl2 = game.flyers.find((f) => !f.hit) || fl; if (fl2) { fl2.launchAt = 0; tr7.pos = { x: fl2.x, y: fl2.y }; }
    game.update(0.033, tr7, t7); t7 += 33;
    check('invulnerable 1.2s after flyer hit', game.stats.hits === 1);
    const res7 = game.stop('manual');
    check('dodge result report + rank key by time', res7.items.some(([k]) => k === '충돌') && res7.items.some(([k]) => k === '게임 시간') && res7.rankKey === 'obstacle@60', { key: res7.rankKey });
    // 평면 판정: 가로 1 × 세로 A, 카메라 쪽으로 밀면(v 큼) 위로
    {
      const gp = new Game(null); gp.setMode('obstacle'); gp.plane = { A: 0.6, flip: true };
      const m0 = gp.toPlane(0.25, 1), m1 = gp.toPlane(0.25, 0);
      check('D1 puck mapped onto the flat plane (flip: push = up)', m0.x === 0.25 && Math.abs(m0.y) < 1e-9 && Math.abs(m1.y - 0.6) < 1e-9, { m0, m1 });
      let bad = 0, sides = new Set();
      for (let i = 0; i < 400; i++) { gp.flyers = []; const fl = gp._spawnFlyer({ x: 0.5, y: 0.3 }, { flyMin: 0.25, flyMax: 0.85 }, 0, 0.6); if (!fl) continue; sides.add(fl.side); const outside = fl.x < 0 || fl.x > 1 || fl.y < 0 || fl.y > 0.6; const sp = Math.hypot(fl.vx, fl.vy); if (!outside || sp < 0.25 - 1e-9 || sp > 0.85 + 1e-9) bad++; }
      check('D1 flyers start outside the plane on all four sides', bad === 0 && sides.size === 4, { bad, sides: [...sides] });
      // 평면에서 충돌: 내 퍽을 평면상의 날아오는 퍽 위치에 두면 감점
      const trp = { pos: { x: 0.5, y: 0.5 }, state: 'tracked', touches: 0, distance: 0, speed: 0, frames: 1, trackedFrames: 1, trackRate: 1 };
      gp.start(trp); let tp2 = 700000;
      for (let i = 0; i < 40; i++) { gp.update(0.033, { ...trp, state: 'predicted' }, tp2); tp2 += 33; }
      const fl = gp.flyers.find((x) => tp2 >= x.launchAt) || gp.flyers[0]; fl.launchAt = 0; fl.hit = false;
      fl.x = 0.4; fl.y = 0.3; fl.vx = 0; fl.vy = 0; // 평면 (0.4, 0.3) = u 0.4, v 0.5 (flip, A=0.6)
      gp.invulnUntil = 0; gp.stats.hits = 0;
      gp.update(0.033, { ...trp, pos: { x: 0.4, y: 0.5 } }, tp2); tp2 += 33;
      check('D1 collision judged on the plane, not the floor', gp.stats.hits === 1 && Math.abs(gp.me.y - 0.3) < 1e-9, { hits: gp.stats.hits, me: gp.me });
      gp.stop('manual');
    }
    // 출발 지점은 항상 바닥 바깥, 플레이어와 0.25 이상 떨어짐
    let badSpawn = 0;
    for (let i = 0; i < 300; i++) { const g5 = new Game(null); g5.setMode('obstacle'); g5.difficulty = 'hard'; g5.start(tr7); const f = g5._spawnFlyer({ x: 0.5, y: 0.5 }, { flyMin: 0.5, flyMax: 1 }, 0); if (!f) continue; const outside = f.x < 0 || f.x > 1 || f.y < 0 || f.y > 1; if (!outside || Math.hypot(f.x - 0.5, f.y - 0.5) < 0.25) badSpawn++; }
    check('flyers always spawn outside the floor away from player', badSpawn === 0, badSpawn);

    // 8) 수동 바닥 모드 + 거울
    settings.floorMode = 'manual';
    settings.manualQuad = [[0.2, 0.25], [0.8, 0.25], [0.95, 0.92], [0.05, 0.92]];
    vision.mirror = true;
    drawScene({ puck: { x: 200, y: 300 } });
    r = vision.process(scene, settings);
    check('manual floor mapping', !!r.floor.mapping && r.floor.mode === 'manual');
    check('mirrored puck x', r.puck && Math.abs(r.puck.x - (640 - 200) * 0.375) < 2, r.puck && r.puck.x);
    const [u, v] = r.floor.mapping.toUV(r.puck.x, r.puck.y);
    const [bx, by] = r.floor.mapping.toPx(u, v);
    check('homography roundtrip', Math.abs(bx - r.puck.x) < 1e-6 && Math.abs(by - r.puck.y) < 1e-6);

    // ===== 회귀: 이전 프로젝트 리뷰에서 확인된 시나리오 =====
    settings.floorMode = 'auto'; settings.manualQuad = null; vision.mirror = false;
    vision.lastPuck = null; vision.lastStick = null; vision.floorAuto = null; vision.floorLocked = false;
    for (let i = 0; i < 12; i++) { drawScene({ puck: { x: 300, y: 300 } }); r = vision.process(scene, settings); }

    // R1) 같은 색·같은 크기의 방해물이 바닥 안 먼 곳에 나타나도 추적 중인 퍽을 유지
    for (let i = 0; i < 5; i++) { drawScene({ puck: { x: 300 + i * 3, y: 300 }, distractor: { x: 500, y: 380 } }); r = vision.process(scene, settings); }
    check('R1 keeps tracked puck over same-color distractor', r.puck && Math.abs(r.puck.x - 312 * 0.375) < 2, { puck: r.puck && [r.puck.x, r.puck.y], cands: r.puckCandidates.length });

    // R2) 보정 터치 시드: 방해물이 더 커도 터치한 위치의 덩어리를 잡음
    vision.lastPuck = null;

    const g2 = new Game(null); g2.setMode('reaction');

    const bad = sanitizeSettings({ ...structuredClone(DEFAULT_SETTINGS), whiteV: 'x', puckTol: 9999, puckModel: { r: -1 }, stickModel: 'orange', floorMode: 'manual', manualQuad: [[0, 0], [2, 0]], difficulty: 'nightmare', p1: '' });

    // ===== 아케이드 서바이벌 =====
    const fakePuck = (x, y, state = 'tracked') => ({ pos: state === 'lost' ? null : { x, y }, state, trail: [], distance: 0, speed: 0, touches: 0 });
    const mk = () => { const ar = new Arcade(null); ar.aspect = 0.5625; ar.start(fakePuck(0.5, 0.5), 'normal'); ar.spawnTimer = 1e9; ar.pickupTimer = 1e9; return ar; };

    const fall = (x, y, r = 0.035, vy = 0.5, color = PUCK_COLORS[0]) => ({ x, y, r, vy, color, minDist: Infinity, passed: false, hit: false, threat: false });
    // A2) 내려오는 퍽과 충돌 -> 감점 (쉬움 3 × 난이도 배율: 보통 5), 1.5초 무적 동안 추가 피격 없음, 연속 터치 초기화
    ar = mk(); t = toPlay(ar, 20000); ar.streak = 7; ar.score = 50;

    check(`A2 falling puck hit = −${ar.hitPenalty} (normal) and streak reset (no lives)`, ar.hits === 1 && ar.streak === 0 && ar.score === 50 - ar.hitPenalty && HIT_PENALTY === 3 && ar.hitPenalty === 5 && ar.lives === undefined, { hits: ar.hits, score: ar.score });
    ar.obstacles.push(fall(0.5, zoneY(ar, 0.5) - 0.05));

    t = stepTo(ar, 0.5, 0.5, t, 2);

    ar = mk(); t = toPlay(ar, 45000); const s3 = ar.points;

    t = stepTo(ar, 0.33, 0.5, t, 2); t = stepTo(ar, 0.3, 0.5, t, 4); // 긴 스윙 뒤 첫 반전은 정상 터치일 수 있으니 먼저 정리
    const s4 = ar.score;
    t = stepTo(ar, 0.33, 0.5, t, 2); t = stepTo(ar, 0.3, 0.5, t, 2); t = stepTo(ar, 0.33, 0.5, t, 2); t = stepTo(ar, 0.3, 0.5, t, 2);
    check('A5 tiny wiggles in place are not touches', ar.score === s4, ar.score - s4);

    {

        && per.easy.coin === 10 && per.normal.coin === 15 && per.hard.coin === 20 && per.easy.hit === 3 && per.normal.hit === 5 && per.hard.hit === 6
        && per.easy.score === 12 && per.normal.score === 18 && per.hard.score === 24, per);
    }

    const fieldW = 1 - 2 * FIELD_MARGIN, avoidFallR = FLYER_R * fieldW, avoidMeR = ME_R * fieldW;

    // 난이도별 개수·속도: 쉬움 < 보통 < 어려움, 어려움은 간격 0.4초(이전 0.8초의 2배 개수)
    {
      const count = (diff) => { const a = new Arcade(null); a.aspect = 0.5625; a.start(fakePuck(0.5, 0.5), diff, true); a.pickupTimer = 1e9; let n = 0, tt = 900000; const seenO = new Set(); for (let i = 0; i < 606; i++) { a.update(0.033, fakePuck(0.02, 0.98, 'predicted'), tt); tt += 33; a.score = 0; a.obstacles.forEach((o) => seenO.add(o)); } return { n: seenO.size, speed: a.speed, iv: a.interval() }; };

    drawDots(false); v2.process(scene, matSettings);
    const dotsSample = v2.autoCalibSample();
    check('F3b scattered pattern is not an object', dotsSample.status !== 'ok', dotsSample);
    drawDots(true); v2.process(scene, matSettings);
    const ballOnDots = v2.autoCalibSample();
    check('F3b ball on patterned mat is detected', ballOnDots.status === 'ok' && ballOnDots.b > 150, ballOnDots);

    // F3c) 대기 원 판단: 등록된 퍽만 시작, 다른 물체는 안내, 미등록이면 학습, 같은 색은 재인식
    const orange = { r: 240, g: 114, b: 28, area: 180 }, blueS = { status: 'ok', r: 39, g: 99, b: 231, area: 90 }, orangeDim = { status: 'ok', r: 150, g: 70, b: 18, area: 120 };
    check('F3c registered puck in circle -> start', decideIdle({ registered: true, puckInCircle: true, sample: { status: 'none' }, model: orange, tol: 85 }) === 'start');
    check('F3c different object -> mismatch (no relearn)', decideIdle({ registered: true, puckInCircle: false, sample: blueS, model: orange, tol: 85 }) === 'mismatch');
    check('F3c same color, dimmer light -> refresh', decideIdle({ registered: true, puckInCircle: false, sample: orangeDim, model: orange, tol: 85 }) === 'refresh');
    check('F3c nothing registered -> learn first object', decideIdle({ registered: false, puckInCircle: false, sample: blueS, model: { r: 0, g: 0, b: 0, area: 0 }, tol: 95 }) === 'learn');
    check('F3c empty / too big', decideIdle({ registered: true, puckInCircle: false, sample: { status: 'none' }, model: orange, tol: 85 }) === 'wait' && decideIdle({ registered: true, puckInCircle: false, sample: { status: 'too_big' }, model: orange, tol: 85 }) === 'too_big');
    check('F3c black puck registered, black puck sample -> refresh not mismatch', decideIdle({ registered: true, puckInCircle: false, sample: { status: 'ok', r: 30, g: 32, b: 35, area: 50 }, model: { r: 10, g: 10, b: 12, area: 48 }, tol: 95 }) === 'refresh');

    // F3d) 게임 종료 후 선택: 왼쪽 2초 = 한 번 더, 오른쪽 2초 = 모드 선택
    {
      check('F3d zones: left / middle / right', choiceSide(0.1) === 'L' && choiceSide(0.5) === null && choiceSide(0.9) === 'R');
      const c = { side: null, hold: 0 }; let fired = null;
      for (let i = 0; i < 30; i++) fired = stepChoice(c, { u: 0.1, tracked: true, dt: 0.033, armed: false }) || fired;
      check('F3d nothing counts before armed', fired === null && c.hold === 0);
      let n = 0; while (!fired && n++ < 200) fired = stepChoice(c, { u: 0.1, tracked: true, dt: 0.033, armed: true });
      check('F3d left zone fires "again" after 2s', fired === 'L' && Math.abs(n * 0.033 - CHOICE_HOLD_S) < 0.1, { fired, t: n * 0.033 });
      const c2 = { side: null, hold: 0 }; let f2 = null;
      for (let i = 0; i < 40; i++) f2 = stepChoice(c2, { u: 0.9, tracked: true, dt: 0.033, armed: true }) || f2;   // 1.3초 오른쪽
      for (let i = 0; i < 5; i++) f2 = stepChoice(c2, { u: 0.5, tracked: true, dt: 0.033, armed: true }) || f2;    // 가운데로 벗어남 -> 초기화
      check('F3d leaving the zone resets the hold', f2 === null && c2.hold === 0 && c2.side === null);
      for (let i = 0; i < 40; i++) f2 = stepChoice(c2, { u: 0.9, tracked: true, dt: 0.033, armed: true }) || f2;
      for (let i = 0; i < 10; i++) f2 = stepChoice(c2, { u: 0.9, tracked: false, dt: 0.033, armed: true }) || f2;  // 추적 끊김 -> 초기화
      check('F3d losing the puck resets the hold', f2 === null && c2.hold === 0);
      let n2 = 0; while (!f2 && n2++ < 200) f2 = stepChoice(c2, { u: 0.9, tracked: true, dt: 0.033, armed: true });
      check('F3d right zone fires "mode" after 2s', f2 === 'R');
      // 모드 카드 머무름: 같은 카드 2초 -> 선택, 카드가 바뀌면 처음부터, 카드 밖(null)은 세지 않음
      const d = { key: null, hold: 0 }; let fd = null;
      for (let i = 0; i < 40; i++) fd = stepDwell(d, 2, 0.033) ?? fd;
      // 카드 테두리 근처는 어느 카드도 아님 (카드 사이를 지나갈 때 엉뚱한 카드가 골라지지 않게)
      const rc = { left: 100, top: 50, width: 200, height: 100 };
      const core = [[200, 100], [100 + 200 * (CARD_INSET + 0.01), 100], [100 + 200 * (CARD_INSET - 0.01), 100], [200, 50 + 100 * (1 - CARD_INSET + 0.01)], [101, 51], [299, 149], [200, 100.5 + 100]].map(([x, y]) => (inCardCore(rc, x, y) ? 1 : 0)).join('');
      check('U4 mode card picks only near its middle, not at the border', core === '1100000' && CARD_INSET >= 0.1 && CARD_INSET <= 0.2, core);
      for (let i = 0; i < 40; i++) fd = stepDwell(d, 4, 0.033) ?? fd;
      check('F3d dwell resets when the card changes', fd === null && d.key === 4);
      for (let i = 0; i < 30; i++) fd = stepDwell(d, 4, 0.033) ?? fd;
      check('F3d dwelling 2s on one card selects it', fd === 4);
      const d2 = { key: null, hold: 0 }; let fd2 = null;
      for (let i = 0; i < 200; i++) fd2 = stepDwell(d2, null, 0.033) ?? fd2;
      check('F3d no card under the cursor never selects', fd2 === null && d2.hold === 0);
    }

    // F4) 흰 바닥 히스테리시스: 10프레임 연속 검출 시 흰 바닥, 90프레임 미검출 시 전체 화면 복귀
    const v3 = new Vision(240); v3.mirror = false; v3.setSourceSize(640, 480);
    const floorSettings = { ...matSettings, puckModel: { r: 0, g: 0, b: 0, area: 0 } };
    for (let i = 0; i < 9; i++) { drawScene({ puck: null }); r = v3.process(scene, floorSettings); }
    const stillFallback = r.floor.fallback === true;
    drawScene({ puck: null }); r = v3.process(scene, floorSettings);
    check('F4 white floor adopted after 10 consecutive frames', stillFallback && r.floor.fallback === false && r.floor.quad[0][0] > 10, { stillFallback, q: r.floor.quad });
    for (let i = 0; i < 89; i++) { drawMat({ lid: null }); r = v3.process(scene, floorSettings); }
    const keptFloor = r.floor.fallback === false;
    drawMat({ lid: null }); r = v3.process(scene, floorSettings);
    check('F4 back to full frame after 3s without white floor', keptFloor && r.floor.fallback === true, { keptFloor, fb: r.floor.fallback });

    // ===== 추적 안정성 + 원근 영역 =====
    // T1) 한 프레임 튀는 측정값은 무시, 3프레임 계속되면 재획득
    const trk = new Tracker(); let tt = 1000;
    for (let i = 0; i < 20; i++) { trk.update({ u: 0.3 + i * 0.002, v: 0.5 }, tt); tt += 33; }
    const before = { ...trk.pos };
    trk.update({ u: 0.8, v: 0.5 }, tt); tt += 33; // 다른 물체 오검출 1프레임
    check('T1 single-frame jump ignored', Math.abs(trk.pos.x - before.x) < 0.02 && trk.rejected === 1, { x: trk.pos.x, before: before.x });
    trk.update({ u: 0.342, v: 0.5 }, tt); tt += 33;
    check('T1 returns to normal tracking', trk.state === 'tracked' && Math.abs(trk.pos.x - 0.34) < 0.02, trk.pos.x);
    for (let i = 0; i < 3; i++) { trk.update({ u: 0.8, v: 0.5 }, tt); tt += 33; }
    trk.update({ u: 0.8, v: 0.5 }, tt); tt += 33;
    check('T1 persistent jump accepted as real move', Math.abs(trk.pos.x - 0.8) < 0.02, trk.pos.x);
    // T2) 정지 상태 미세 떨림 억제, 등속 이동은 지연 없이 따라감
    const trk2 = new Tracker(); tt = 5000;
    for (let i = 0; i < 30; i++) { trk2.update({ u: 0.5 + (i % 2 ? 0.002 : -0.002), v: 0.5 }, tt); tt += 33; }
    const jitter = Math.abs(trk2.pos.x - 0.5);
    check('T2 jitter at rest suppressed', jitter < 0.003 && trk2.speed < 0.05, { jitter, speed: trk2.speed });
    const trk3 = new Tracker(); tt = 9000; let lag = 0;
    for (let i = 0; i < 40; i++) { const u = 0.2 + i * 0.015; trk3.update({ u, v: 0.5 }, tt); tt += 33; if (i > 10) lag = Math.max(lag, Math.abs(trk3.pos.x - u)); }
    check('T2 constant motion followed with small lag', lag < 0.02, lag);
    // T3) 흰 바닥 자동 감지가 원근 사다리꼴(위 좁고 아래 넓음)로 잡힘
    const v4 = new Vision(240); v4.mirror = false; v4.setSourceSize(640, 480);
    for (let i = 0; i < 15; i++) { drawScene({ puck: null }); r = v4.process(scene, { ...settings, floorMode: 'auto', manualQuad: null, puckModel: { r: 0, g: 0, b: 0, area: 0 } }); }
    const q4 = r.floor.quad;
    check('T3 auto floor is a trapezoid narrower at the back', q4[0][0] > q4[3][0] + 10 && q4[1][0] < q4[2][0] - 10 && Math.abs(q4[0][0] - 120 * 0.375) < 8 && Math.abs(q4[3][0] - 40 * 0.375) < 8, q4);
    // 같은 화면 x 라도 뒤쪽(위)에서는 더 큰 u 변화 -> 원근 보정된 바닥 좌표
    const mp = r.floor.mapping;
    const duTop = mp.toUV(170 * 0.375 + 20, 130 * 0.375)[0] - mp.toUV(170 * 0.375, 130 * 0.375)[0];
    const duBot = mp.toUV(170 * 0.375 + 20, 430 * 0.375)[0] - mp.toUV(170 * 0.375, 430 * 0.375)[0];
    check('T3 perspective mapping: same pixel step is a larger floor step at the back', duTop > duBot * 1.15, { duTop, duBot });

    // ===== 보정 개선: 터치로 지정이 작은 퍽에 붙기 · 원 안 자동 지정의 배경 중앙값 · 작은 퍽 · 가림 =====
    {
      // Q1) 터치로 지정: 작은 공에서 손가락이 5px 빗나가도 공으로 붙고, 바닥과 섞인 가장자리 대신 공 색
      const v5 = new Vision(240); v5.mirror = false; v5.setSourceSize(640, 480);
      const s5 = { ...settings, floorMode: 'auto', manualQuad: null, puckModel: { r: 0, g: 0, b: 0, area: 0 }, stickModel: null };
      const drawSmall = () => { drawScene({ puck: null }); sctx.fillStyle = '#1d4ed8'; sctx.beginPath(); sctx.arc(320, 260, 6, 0, Math.PI * 2); sctx.fill(); };
      for (let i = 0; i < 12; i++) { drawSmall(); v5.process(scene, s5); }
      const tapX = Math.round(320 * 0.375 + 5), tapY = Math.round(260 * 0.375 - 3);
      const miss = v5.sampleObject(tapX, tapY, 95), old = v5._sampleAt(tapX, tapY, 95);
      check('Q1 tap a few px off a small ball snaps to it with its true color', miss.snapped && Math.abs(miss.cx - 120) < 1.5 && Math.abs(miss.cy - 97.5) < 1.5 && miss.b > 150 && miss.r < 90 && miss.area >= 4 && miss.area < 40 && miss.tol >= 45, { miss, old });
      check('Q1 (the old 5x5 average at that spot was floor color)', old.r > 170 && old.g > 170, old);
      const plain = v5.sampleObject(70, 135, 70);
      check('Q1 tap on empty floor does not snap (old behavior, floor-like)', plain && !plain.snapped && v5.isFloorLike(plain, s5), plain);

      // Q2) 원 바깥 고리를 어두운 다리 두 개가 덮어도(고리의 약 45%) 바닥색은 중앙값으로 — 바닥이 물체로 보여 '너무 큼'이 되지 않음
      const v6 = new Vision(240); v6.mirror = false; v6.setSourceSize(640, 480);
      const s6 = { ...matSettings, floorMode: 'full', puckModel: { r: 0, g: 0, b: 0, area: 0 } };
      sctx.fillStyle = '#eceae4'; sctx.fillRect(0, 0, 640, 480);
      sctx.fillStyle = '#1f2937'; sctx.fillRect(0, 0, 230, 480); sctx.fillRect(410, 0, 230, 480);
      sctx.fillStyle = '#111827'; sctx.beginPath(); sctx.ellipse(320, 240, 14, 9, 0, 0, Math.PI * 2); sctx.fill();
      v6.process(scene, s6);
      const legs = v6.autoCalibSample();
      check('Q2 legs around the circle do not hide the puck (median background)', legs.status === 'ok' && legs.r < 60 && Math.abs(legs.cx - 120) < 2 && Math.abs(legs.cy - 90) < 2, legs);

      // Q3) 게임 영역이 원보다 조금만 큰 경우: 영역 밖(회색)이 아니라 영역 안 바닥색을 배경으로
      const v7 = new Vision(240); v7.mirror = false; v7.setSourceSize(640, 480);
      const s7 = { ...matSettings, floorMode: 'manual', manualQuad: [[0.35, 0.3], [0.65, 0.3], [0.65, 0.7], [0.35, 0.7]], puckModel: { r: 0, g: 0, b: 0, area: 0 } };
      sctx.fillStyle = '#4b5563'; sctx.fillRect(0, 0, 640, 480);
      sctx.fillStyle = '#f3f4f6'; sctx.fillRect(224, 144, 192, 192);
      sctx.fillStyle = '#f97316'; sctx.beginPath(); sctx.arc(320, 240, 10, 0, Math.PI * 2); sctx.fill();
      v7.process(scene, s7);
      const small = v7.autoCalibSample();
      check('Q3 small game area: background measured inside the area', small.status === 'ok' && small.r > 200 && small.b < 90 && small.bg.r > 200, small);

      // Q4) 아주 작은 퍽(처리 해상도에서 지름 3px 남짓)도 원 안에 3초 두면 등록
      const v8 = new Vision(240); v8.mirror = false; v8.setSourceSize(640, 480);
      const cal8 = new AutoCalibrator(3); let d8 = null;
      for (let i = 0; i < 120 && !d8; i++) {
        sctx.fillStyle = '#eceae4'; sctx.fillRect(0, 0, 640, 480);
        sctx.fillStyle = '#111827'; sctx.beginPath(); sctx.arc(320, 240, 4.5, 0, Math.PI * 2); sctx.fill();
        v8.process(scene, s6); d8 = cal8.update(v8.autoCalibSample(), 0.033);
      }
      // 색은 바닥과 섞인 가장자리를 빼고 잰다 (예전: 작은 검정 퍽이 회색 rgb(70,75,85)로 등록돼 추적 색이 틀어짐)
      check('Q4 tiny puck (area < 15px) registers from the circle with its true (dark) color', !!d8 && d8.area >= 5 && d8.area < 15 && d8.r < 50 && d8.g < 50, d8);

      // Q6) 두 가지 색 퍽(가운데 흰색·테두리 검정): 바닥과 더 다른 쪽 색으로 등록되고 움직여도 따라감 (흰 바닥 = 검정 테두리, 어두운 바닥 = 흰 가운데)
      const twoTone = (floor) => {
        const drawT = (x, y) => { sctx.fillStyle = floor; sctx.fillRect(0, 0, 640, 480); sctx.fillStyle = '#111827'; sctx.beginPath(); sctx.arc(x, y, 14, 0, Math.PI * 2); sctx.fill(); sctx.fillStyle = '#f8fafc'; sctx.beginPath(); sctx.arc(x, y, 9, 0, Math.PI * 2); sctx.fill(); };
        const vt = new Vision(240); vt.mirror = false; vt.setSourceSize(640, 480);
        const st = { ...s6, puckModel: { r: 0, g: 0, b: 0, area: 0 } };
        const ct = new AutoCalibrator(3); let dt = null;
        for (let i = 0; i < 140 && !dt; i++) { drawT(320, 240); vt.process(scene, st); dt = ct.update(vt.autoCalibSample(), 0.033); }
        if (!dt) return { registered: false };
        st.puckModel = { r: dt.r, g: dt.g, b: dt.b, area: dt.area }; st.puckTol = dt.tol; vt.seedPuck(dt.cx, dt.cy, dt.area);
        let seen = 0;
        for (let i = 0; i < 60; i++) { const x = 320 + Math.sin(i / 9) * 200, y = 260 + Math.cos(i / 13) * 120; drawT(x, y); const pr = vt.process(scene, st).puck; if (pr && Math.hypot(pr.x - x * 0.375, pr.y - y * 0.375) < 3) seen++; }
        return { registered: true, color: [dt.r, dt.g, dt.b], seen };
      };
      const ttWhite = twoTone('#f3f4f6'), ttDark = twoTone('#374151');
      check('Q6 two-tone puck (white center, black rim) registers by the part that differs from the floor and is tracked',
        ttWhite.registered && ttWhite.color[0] < 60 && ttWhite.seen >= 57 && ttDark.registered && ttDark.color[0] > 200 && ttDark.seen >= 57, { ttWhite, ttDark });

      // Q7) 검정 퍽이 검정 스케이트에 닿아 한 덩어리가 돼도 퍽 모양 부분만 떼어 낸다. 퍽을 집어 가면 스케이트 앞코를 퍽으로 잡지 않고, 붙은 채로는 1.5초까지만
      const drawSkate = (puck, px, py, bootR, bootY = py) => {
        sctx.fillStyle = '#eceae4'; sctx.fillRect(0, 0, 640, 480);
        sctx.fillStyle = '#16181d'; sctx.beginPath(); sctx.roundRect(bootR - 110, bootY - 26, 110, 40, 14); sctx.fill();
        sctx.fillStyle = '#c7ccd4'; sctx.fillRect(bootR - 104, bootY + 14, 98, 5);
        if (puck) { sctx.fillStyle = '#111827'; sctx.beginPath(); sctx.ellipse(px, py, 12, 8, 0, 0, Math.PI * 2); sctx.fill(); }
      };
      const skateRun = () => { const vk = new Vision(240); vk.mirror = false; vk.setSourceSize(640, 480); return vk; };
      const sk = { ...s6, puckModel: { r: 17, g: 24, b: 39, area: 40 }, puckTol: 120 };
      const at = (r, px, py) => !!r.puck && Math.hypot(r.puck.x - px * 0.375, r.puck.y - py * 0.375) < 3;
      const touch = {};
      for (const gap of [0, -4]) {
        const vk = skateRun(); let n = 0;
        for (let i = 0; i < 6; i++) { drawSkate(true, 400, 260, 340); vk.process(scene, sk); }
        for (let i = 0; i < 20; i++) { drawSkate(true, 400 + (i % 2), 260, 388 - gap + (i % 2)); if (at(vk.process(scene, sk), 400 + (i % 2), 260)) n++; }
        touch[gap] = n;
      }
      const vg = skateRun(); let ghost = 0;
      for (let i = 0; i < 6; i++) { drawSkate(true, 400, 260, 340); vg.process(scene, sk); }
      for (let i = 0; i < 8; i++) { drawSkate(true, 400, 260, 388); vg.process(scene, sk); }
      for (let i = 0; i < 60; i++) { drawSkate(false, 0, 260, 388); if (vg.process(scene, sk).puck) ghost++; }
      const vh = skateRun(); let held = 0;
      for (let i = 0; i < 6; i++) { drawSkate(true, 400, 260, 340); vh.process(scene, sk); }
      for (let i = 0; i < 60; i++) { drawSkate(true, 400 + (i % 2), 260, 388 + (i % 2)); if (at(vh.process(scene, sk), 400 + (i % 2), 260)) held++; }
      check('Q7 black puck touching a black skate is split out of the merged blob; picking the puck up leaves no ghost; held contact ends after 1.5 s',
        touch[0] === 20 && touch[-4] === 20 && ghost === 0 && held >= 40 && held <= 46, { touch, ghost, held });
    }
    // Q5) 스틱 블레이드에 80% 가린 퍽: 마지막 자리 바로 그곳이면 작은 조각도 퍽으로
    {
      const v9 = new Vision(240); v9.mirror = false; v9.setSourceSize(640, 480);
      const s9 = { ...settings, floorMode: 'auto', manualQuad: null, puckModel: { r: 17, g: 24, b: 39, area: 54 }, puckTol: 95, stickModel: null };
      for (let i = 0; i < 12; i++) { drawScene({ puck: { x: 330, y: 260 } }); v9.process(scene, s9); }
      drawScene({ puck: { x: 330, y: 260 } }); sctx.fillStyle = '#f97316'; sctx.fillRect(311, 245, 26, 30); // 오른쪽 끝 약 20%만 남김
      const pr = v9.process(scene, s9);
      check('Q5 puck mostly under the blade still tracked at its spot', pr.puck && Math.abs(pr.puck.x - 330 * 0.375) < 6 && Math.abs(pr.puck.y - 260 * 0.375) < 3 && pr.puck.area < 54 * 0.25, pr.puck);
      drawScene({ puck: { x: 330, y: 260 } });
      const pr2 = v9.process(scene, s9);
      check('Q5 remembered size unchanged by the partial view', pr2.puck && v9.lastPuck.area > 40, { area: v9.lastPuck.area });
    }
    // CAM) 카메라 높이: 실제 크기 3D 장면(2m×1.5m 흰 연습판, 지름 7.6cm·두께 2.5cm 퍽, 화각 66°)을 높이별로 찍어
    //      가운데 원 등록 -> 5×5 격자 추적. 안내(1~1.5m 권장, 최소 80cm)의 근거가 되는 수치를 지킨다
    {
      const W = 2.0, Dp = 1.5, PR = 0.038, PT = 0.025, FL = 320 / Math.tan(33 * Math.PI / 180);
      const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

    settings.debug = true;
    const t0 = performance.now();
    for (let i = 0; i < 60; i++) vision.process(scene, settings);
    const ms = (performance.now() - t0) / 60;
    out.logs.push(`INFO avg process time ${ms.toFixed(2)} ms/frame (debug on)`);
    check('debug image built', !!vision.debugImage);
    return out;
  };
</script>
