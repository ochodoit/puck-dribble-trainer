<!doctype html>
<html><head><meta charset="utf-8"><title>vision harness</title></head>
<body>
<canvas id="scene" width="640" height="480"></canvas>
<canvas id="arcade" width="1280" height="720"></canvas>
<script type="module">
  import { Vision } from '../src/vision.js';
  import { Tracker } from '../src/tracker.js';
  import { Game } from '../src/game.js';
  import { sanitizeSettings, DEFAULT_SETTINGS } from '../src/storage.js';
  import { Arcade, PUCK_R } from '../src/arcade.js';

  const scene = document.getElementById('scene');
  const sctx = scene.getContext('2d');

  // 합성 장면: 회색 배경 + 흰 바닥 사각형(원근) + 검정 퍽 + 주황 스틱 블레이드 + 어두운 신발(노이즈)
  function drawScene({ puck, stick, shoe, distractor, stickShade = 1, glare = false }) {
    sctx.fillStyle = '#6b7280'; sctx.fillRect(0, 0, 640, 480);
    sctx.fillStyle = '#f3f4f6';
    sctx.beginPath(); sctx.moveTo(120, 120); sctx.lineTo(520, 120); sctx.lineTo(600, 440); sctx.lineTo(40, 440); sctx.closePath(); sctx.fill();
    // 바닥 음영
    sctx.fillStyle = 'rgba(0,0,0,0.08)'; sctx.fillRect(40, 300, 560, 140);
    if (shoe) { sctx.fillStyle = '#1f2937'; sctx.fillRect(shoe.x, shoe.y, 60, 28); }
    if (distractor) { sctx.fillStyle = '#111827'; sctx.beginPath(); sctx.ellipse(distractor.x, distractor.y, distractor.rx || 14, distractor.ry || 9, 0, 0, Math.PI * 2); sctx.fill(); }
    if (stick) {
      const sh = Math.round(249 * stickShade), sg = Math.round(115 * stickShade), sb = Math.round(22 * stickShade);
      sctx.strokeStyle = `rgb(${sh},${sg},${sb})`; sctx.lineWidth = 10; sctx.lineCap = 'round';
      sctx.beginPath(); sctx.moveTo(stick.x, stick.y); sctx.lineTo(stick.x + 40, stick.y - 6); sctx.stroke();
    }
    if (puck) {
      sctx.fillStyle = '#111827'; sctx.beginPath(); sctx.ellipse(puck.x, puck.y, 14, 9, 0, 0, Math.PI * 2); sctx.fill();
      if (glare) { sctx.fillStyle = '#e5e7eb'; sctx.fillRect(puck.x - 1, puck.y - 10, 3, 20); } // 반사광으로 퍽이 둘로 갈라짐
    }
  }

  const settings = {
    whiteV: 150, whiteC: 55, puckTol: 95, stickTol: 70,
    puckModel: { r: 0, g: 0, b: 0, area: 0 }, stickModel: null,
    floorMode: 'auto', manualQuad: null, debug: false,
  };

  // 아케이드 화면 데모 (스크린샷 확인용)
  window.renderArcadeDemo = () => {
    const cv = document.getElementById('arcade'); const ctx = cv.getContext('2d');
    ctx.fillStyle = '#6b7280'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#e5e7eb'; ctx.fillRect(120, 300, 1040, 420);
    const ar = new Arcade(null); ar.aspect = cv.height / cv.width; ar.start({ distance: 0 }, 'normal'); ar.phase = 'play';
    ar.score = 1830; ar.combo = 12; ar.maxCombo = 12; ar.level = 1; ar.speedMul = 1.1; ar.lives = 2;
    ar.avatar = ar.toZone(0.42, 0.55);
    ar.obstacles.push({ type: 'blocker', x: 0.25, y: 0.18, w: 0.15, h: 0.08, vy: 0.3, round: true });
    ar.obstacles.push({ type: 'gate', x: 1 - 0.325, y: 0.05, w: 0.65, h: 0.055, vy: 0.3, side: 'R' });
    ar.obstacles.push({ type: 'gap', x: 0.5, y: 0.3, w: 1, h: 0.05, vy: 0.3, holeX: 0.62, hole: 0.088 });
    ar.obstacles.push({ type: 'beam', band: 'near', state: 'fire', t: 0.5, warn: 0.9, sweep: 1.3, x: 0.7, dir: 1, w: 0.016, h: ar.zoneH / 2, y: 0 });
    ar.pickups.push({ x: 0.75, y: 0.42, r: 0.028, vy: 0.3, born: 0 });
    ar.effects.push({ type: 'pop', x: 0.42, y: ar.avatar.y - 0.08, text: 'DEKE! +100 ×2', color: '#38bdf8', t0: performance.now(), dur: 900, age: 0.2 });
    ar.draw(ctx, cv.width, cv.height, 1234, { trail: [], state: 'tracked' });
    return true;
  };

  window.runTests = async () => {
    const out = { ok: true, logs: [], errors: [] };
    const check = (name, cond, detail) => { out.logs.push(`${cond ? 'PASS' : 'FAIL'} ${name}${detail ? ' ' + JSON.stringify(detail) : ''}`); if (!cond) out.ok = false; };

    const vision = new Vision(240);
    vision.mirror = false;
    vision.setSourceSize(640, 480);

    // 1) 바닥 + 퍽 감지 (여러 프레임 돌려 EMA 안정화)
    drawScene({ puck: { x: 320, y: 300 }, stick: null, shoe: null });
    let r;
    for (let i = 0; i < 12; i++) r = vision.process(scene, settings);
    check('floor detected', r.floor.detected && !!r.floor.mapping);
    const q = r.floor.quad;
    check('floor bbox plausible', q && q[0][0] < 240 * 0.12 && q[1][0] > 240 * 0.85 && q[0][1] > 240 * 0.2 * 0.75 && q[2][1] > 240 * 0.68, q);
    check('puck detected', !!r.puck, r.puck);
    // 퍽 위치: 640x480 -> 240x180 배율 0.375
    check('puck position', r.puck && Math.abs(r.puck.x - 320 * 0.375) < 2 && Math.abs(r.puck.y - 300 * 0.375) < 2, r.puck && [r.puck.x, r.puck.y]);

    // 2) 스틱 보정 (주황 테이프 터치) + 추적
    drawScene({ puck: { x: 300, y: 320 }, stick: { x: 340, y: 300 }, shoe: null });
    r = vision.process(scene, settings);
    const sample = vision.sampleObject(360 * 0.375, 297 * 0.375, settings.stickTol);
    check('stick sample is orange', sample && sample.r > 200 && sample.g > 80 && sample.g < 160 && sample.b < 80, sample);
    check('stick sample not floor-like', sample && !vision.isFloorLike(sample, settings));
    settings.stickModel = { ...sample };
    r = vision.process(scene, settings);
    check('stick detected', !!r.stick, r.stick);
    check('stick position', r.stick && Math.abs(r.stick.x - 360 * 0.375) < 4 && Math.abs(r.stick.y - 297 * 0.375) < 4, r.stick && [r.stick.x, r.stick.y]);
    check('puck still detected with stick', !!r.puck && Math.abs(r.puck.x - 300 * 0.375) < 2, r.puck);

    // 3) 퍽 보정 (검정 퍽 터치) -> 면적 학습
    const ps = vision.sampleObject(300 * 0.375, 320 * 0.375, settings.puckTol);
    check('puck sample dark', ps && ps.r < 40 && ps.area > 10 && ps.area < 120, ps);
    settings.puckModel = { ...ps };

    // 4) 큰 어두운 물체(신발)가 있어도 퍽 선택
    drawScene({ puck: { x: 420, y: 350 }, stick: { x: 340, y: 300 }, shoe: { x: 200, y: 380 } });
    r = vision.process(scene, settings);
    check('puck chosen over shoe', r.puck && Math.abs(r.puck.x - 420 * 0.375) < 2, { puck: r.puck && [r.puck.x, r.puck.y], cands: r.puckCandidates.map((c) => [c.area, +c.score.toFixed(2)]) });

    // 5) 흰색 샘플은 거부
    const ws = vision.sampleObject(320 * 0.375, 200 * 0.375, 70);
    check('white sample flagged floor-like', ws && vision.isFloorLike(ws, settings), ws);

    // 6) 트래커 + 게임: 퍽이 좌우로 움직이면 터치 카운트 증가, 와이드 모드 반복 증가
    const tracker = new Tracker();
    const game = new Game(null);
    game.setMode('wide');
    let now = 1000;
    for (let i = 0; i < 10; i++) { drawScene({ puck: { x: 320, y: 300 } }); r = vision.process(scene, settings); const [u, v] = r.floor.mapping.toUV(r.puck.x, r.puck.y); tracker.update({ u, v }, now); now += 33; }
    game.start(tracker);
    let lastU = null;
    for (let t = 0; t < 240; t++) {
      const x = 320 + Math.sin(t / 8) * 230;  // 좌우 왕복 (약 1.65초 주기)
      drawScene({ puck: { x, y: 300 } });
      r = vision.process(scene, settings);
      let meas = null;
      if (r.puck) { const [u, v] = r.floor.mapping.toUV(r.puck.x, r.puck.y); meas = { u, v }; lastU = u; }
      tracker.update(meas, now);
      game.update(0.033, tracker, now);
      now += 33;
    }
    check('tracker counts touches', tracker.touches >= 6, { touches: tracker.touches, lastU });
    check('wide drill counts reps', game.stats.reps >= 6, game.stats);
    check('timer runs down', game.timeLeft < 30 && game.timeLeft > 20, game.timeLeft);
    const result = game.stop('manual');
    check('result built', result && result.items.length >= 2, result && result.items);

    // 7) 퍽 피하기 서바이벌: 사방에서 직선으로 날아오는 빨간 퍽, 개수 증가, 충돌/무적, 회피 카운트
    game.setMode('obstacle');
    game.difficulty = 'normal';
    const tr7 = { pos: { x: 0.5, y: 0.5 }, state: 'tracked', touches: 0, distance: 0, speed: 0, frames: 10, trackedFrames: 10, trackRate: 1 };
    let t7 = 100000;
    game.start(tr7);
    for (let i = 0; i < 60; i++) { game.update(0.033, tr7, t7); t7 += 33; } // 2초
    const early = game.stats.maxFlyers;
    check('flyers spawned from the four sides', game.flyers.length >= 1 && game.flyers.every((f) => f.side >= 0 && f.side <= 3), game.flyers.length);
    const f0 = game.flyers[0];
    const dir0 = Math.atan2(f0.vy, f0.vx), sp0 = Math.hypot(f0.vx, f0.vy);
    check('flyer speed within difficulty range', sp0 >= 0.35 - 1e-9 && sp0 <= 0.75 + 1e-9, sp0);
    const x1 = f0.x, y1 = f0.y;
    for (let i = 0; i < 10; i++) { game.update(0.033, tr7, t7); t7 += 33; }
    const moved = Math.atan2(f0.y - y1, f0.x - x1);
    check('flyer travels in a straight line at constant speed', Math.abs(moved - dir0) < 1e-6 && Math.abs(Math.hypot(f0.vx, f0.vy) - sp0) < 1e-9, { dir0, moved });
    // 20초 경과 -> 동시 퍽 수 증가 (normal: 2 + floor(20/9) = 4)
    tr7.state = 'predicted'; // 피격 없이 시간만 흐르게
    for (let i = 0; i < 600; i++) { game.update(0.033, tr7, t7); t7 += 33; }
    check('flyer count grows over time', game.stats.maxFlyers >= 4 && game.stats.maxFlyers > early, { early, max: game.stats.maxFlyers });
    check('dodged pucks are counted', game.stats.dodged > 0 && game.score >= 200, { dodged: game.stats.dodged, score: game.score });
    // 충돌: 플레이어를 날아오는 퍽 위에 둠
    tr7.state = 'tracked';
    const fl = game.flyers.find((f) => t7 >= f.launchAt) || game.flyers[0];
    fl.launchAt = 0; tr7.pos = { x: fl.x, y: fl.y };
    game.update(0.033, tr7, t7); t7 += 33;
    check('flyer hit costs a life', game.lives === 2 && game.stats.hits === 1, { lives: game.lives });
    const fl2 = game.flyers.find((f) => !f.hit) || fl; if (fl2) { fl2.launchAt = 0; tr7.pos = { x: fl2.x, y: fl2.y }; }
    game.update(0.033, tr7, t7); t7 += 33;
    check('invulnerable 1.2s after flyer hit', game.lives === 2);
    const res7 = game.stop('manual');
    check('survival result report', res7.items.some(([k]) => k === '생존 시간') && res7.items.some(([k]) => k === '최대 동시 퍽'), res7.items);
    // 출발 지점은 항상 바닥 바깥, 플레이어와 0.25 이상 떨어짐
    let badSpawn = 0;
    for (let i = 0; i < 300; i++) { const g5 = new Game(null); g5.setMode('obstacle'); g5.difficulty = 'hard'; g5.start(tr7); const f = g5._spawnFlyer({ x: 0.5, y: 0.5 }, { flyMin: 0.5, flyMax: 1 }, 0); if (!f) continue; const outside = f.x < 0 || f.x > 1 || f.y < 0 || f.y > 1; if (!outside || Math.hypot(f.x - 0.5, f.y - 0.5) < 0.25) badSpawn++; }
    check('flyers always spawn outside the floor away from player', badSpawn === 0, badSpawn);

    // 8) 수동 바닥 모드 + 거울
    settings.floorMode = 'manual';
    settings.manualQuad = [[0.2, 0.25], [0.8, 0.25], [0.95, 0.92], [0.05, 0.92]];
    vision.mirror = true;
    drawScene({ puck: { x: 200, y: 300 } });
    r = vision.process(scene, settings);
    check('manual floor mapping', !!r.floor.mapping && r.floor.mode === 'manual');
    check('mirrored puck x', r.puck && Math.abs(r.puck.x - (640 - 200) * 0.375) < 2, r.puck && r.puck.x);
    const [u, v] = r.floor.mapping.toUV(r.puck.x, r.puck.y);
    const [bx, by] = r.floor.mapping.toPx(u, v);
    check('homography roundtrip', Math.abs(bx - r.puck.x) < 1e-6 && Math.abs(by - r.puck.y) < 1e-6);

    // ===== 회귀: 이전 프로젝트 리뷰에서 확인된 시나리오 =====
    settings.floorMode = 'auto'; settings.manualQuad = null; vision.mirror = false;
    vision.lastPuck = null; vision.lastStick = null; vision.floorAuto = null; vision.floorLocked = false;
    for (let i = 0; i < 12; i++) { drawScene({ puck: { x: 300, y: 300 } }); r = vision.process(scene, settings); }

    // R1) 같은 색·같은 크기의 방해물이 바닥 안 먼 곳에 나타나도 추적 중인 퍽을 유지
    for (let i = 0; i < 5; i++) { drawScene({ puck: { x: 300 + i * 3, y: 300 }, distractor: { x: 500, y: 380 } }); r = vision.process(scene, settings); }
    check('R1 keeps tracked puck over same-color distractor', r.puck && Math.abs(r.puck.x - 312 * 0.375) < 2, { puck: r.puck && [r.puck.x, r.puck.y], cands: r.puckCandidates.length });

    // R2) 보정 터치 시드: 방해물이 더 커도 터치한 위치의 덩어리를 잡음
    vision.lastPuck = null;
    drawScene({ puck: { x: 300, y: 300 }, distractor: { x: 480, y: 380, rx: 18, ry: 12 } });
    r = vision.process(scene, settings);
    vision.seedPuck(300 * 0.375, 300 * 0.375, 54);
    r = vision.process(scene, settings);
    check('R2 seed from calibration tap picks tapped blob', r.puck && Math.abs(r.puck.x - 300 * 0.375) < 2, r.puck && [r.puck.x, r.puck.y]);

    // R3) 강타: 스틱이 퍽 옆에 있을 때 한 프레임에 45px(proc) 점프해도 놓치지 않음
    settings.stickModel = { r: 244, g: 142, b: 71, area: 67 };
    for (let i = 0; i < 4; i++) { drawScene({ puck: { x: 300, y: 300 }, stick: { x: 316, y: 304 } }); r = vision.process(scene, settings); }
    check('R3 setup: stick near puck', !!r.stick && !!r.puck);
    drawScene({ puck: { x: 420, y: 300 }, stick: { x: 316, y: 304 } }); // 120px(원본) = 45px(proc) 점프
    r = vision.process(scene, settings);
    check('R3 hard shot still tracked (wide gate near stick)', r.puck && Math.abs(r.puck.x - 420 * 0.375) < 2, r.puck && [r.puck.x, r.puck.y, r.puck.score]);
    drawScene({ puck: { x: 520, y: 300 }, stick: { x: 316, y: 304 } }); // 속도 예측으로 계속 추적
    r = vision.process(scene, settings);
    check('R3 velocity prediction follows fast puck', r.puck && Math.abs(r.puck.x - 520 * 0.375) < 2, r.puck && [r.puck.x, r.puck.y, r.puck.score]);

    // R4) 놓친 뒤 재획득: 크기가 2.7배인 어두운 물체는 거부, 진짜 퍽이 다시 보이면 수용
    for (let i = 0; i < 4; i++) { drawScene({ puck: { x: 300, y: 320 } }); r = vision.process(scene, settings); }
    for (let i = 0; i < 3; i++) { drawScene({ puck: null }); r = vision.process(scene, settings); }
    check('R4 puck lost', !r.puck && vision.lastPuck && vision.lastPuck.missed === 3);
    drawScene({ puck: null, distractor: { x: 330, y: 330, rx: 23, ry: 15 } });
    r = vision.process(scene, settings);
    check('R4 reacquire rejects wrong-size blob', !r.puck, r.puck);
    drawScene({ puck: { x: 310, y: 325 } });
    r = vision.process(scene, settings);
    check('R4 reacquire accepts real puck', r.puck && Math.abs(r.puck.x - 310 * 0.375) < 2, r.puck && [r.puck.x, r.puck.y]);

    // R5) 조명이 어두워져 스틱 테이프 RGB가 60%로 떨어져도(색도 비교) 계속 인식
    drawScene({ puck: { x: 300, y: 320 }, stick: { x: 340, y: 300 }, stickShade: 0.6 });
    r = vision.process(scene, settings);
    check('R5 stick detected under dim light (chroma match)', r.stick && Math.abs(r.stick.x - 360 * 0.375) < 4, r.stick && [r.stick.x, r.stick.y]);
    drawScene({ puck: { x: 300, y: 320 }, stick: null, shoe: { x: 330, y: 290 } }); // 어두운 회색 물체는 스틱으로 안 잡힘
    r = vision.process(scene, settings);
    check('R5 gray object not matched as stick', !r.stick, r.stick);

    // R6) 반사광으로 퍽 마스크가 둘로 갈라져도 하나로 병합
    for (let i = 0; i < 3; i++) { drawScene({ puck: { x: 300, y: 320 }, glare: true }); r = vision.process(scene, settings); }
    check('R6 glare-split puck merged', r.puck && r.puck.area > 35 && Math.abs(r.puck.x - 300 * 0.375) < 2, r.puck && [r.puck.x, r.puck.area]);

    // R7) 반응 모드: 반응 시간(첫 움직임)과 이동 시간 분리, 타겟은 일정 거리 범위
    const g2 = new Game(null); g2.setMode('reaction');
    const tr2 = new Tracker(); tr2.pos = { x: 0.5, y: 0.5 }; tr2.state = 'tracked'; tr2.speed = 0; tr2.frames = 10; tr2.trackedFrames = 9;
    let t2 = 5000; g2.start(tr2);
    const tg = g2.targets[0];
    const dd = Math.hypot(tg.x - 0.5, tg.y - 0.5);
    check('R7 target within distance band', dd >= 0.3 && dd <= 0.5, dd);
    for (let i = 0; i < 15; i++) { g2.update(0.033, tr2, t2); t2 += 33; } // 0.5초 정지 (반응 중)
    tr2.speed = 1.0; g2.update(0.033, tr2, t2); t2 += 33;   // 움직이기 시작
    for (let i = 0; i < 30; i++) { g2.update(0.033, tr2, t2); t2 += 33; } // 1초 이동
    tr2.pos = { x: tg.x, y: tg.y }; g2.update(0.033, tr2, t2); t2 += 33;
    check('R7 reaction excludes travel time', g2.stats.times.length === 1 && g2.stats.times[0] > 0.45 && g2.stats.times[0] < 0.6 && g2.stats.travel[0] > 0.9, g2.stats);
    const res2 = g2.stop('manual');
    check('R7 result includes track rate', res2.items.some(([k]) => k === '퍽 추적률'), res2.items);

    // R9) 손상된 저장값 검증
    const bad = sanitizeSettings({ ...structuredClone(DEFAULT_SETTINGS), whiteV: 'x', puckTol: 9999, puckModel: { r: -1 }, stickModel: 'orange', floorMode: 'manual', manualQuad: [[0, 0], [2, 0]], difficulty: 'nightmare', p1: '' });
    check('R9 sanitize restores defaults', bad.whiteV === 150 && bad.puckTol === 95 && bad.puckModel.r === 0 && bad.stickModel === null && bad.floorMode === 'auto' && bad.manualQuad === null && bad.difficulty === 'normal' && bad.p1 === '플레이어 1', bad);
    settings.stickModel = null;

    // ===== 노트북 웹캠 대응 =====
    // L1) 게임 영역 = 카메라 화면 전체: 흰 바닥 없이(회색 배경) 밝은 퍽 추적
    settings.floorMode = 'full'; vision.mirror = false; vision.lastPuck = null;
    sctx.fillStyle = '#4b5563'; sctx.fillRect(0, 0, 640, 480); // 어두운 방 바닥
    sctx.fillStyle = '#f97316'; sctx.beginPath(); sctx.ellipse(150, 400, 14, 9, 0, 0, Math.PI * 2); sctx.fill(); // 주황 볼
    const ballSample = (vision.process(scene, settings), vision.sampleObject(150 * 0.375, 400 * 0.375, 95));
    settings.puckModel = { ...ballSample };
    r = vision.process(scene, settings);
    check('L1 full-frame area maps whole camera', r.floor.mode === 'full' && r.floor.mapping && r.floor.quad[0][0] < 6 && r.floor.quad[2][0] > vision.PW - 6);
    check('L1 bright puck tracked without white floor', r.puck && Math.abs(r.puck.x - 150 * 0.375) < 2, r.puck && [r.puck.x, r.puck.y]);
    const [lu, lv] = r.floor.mapping.toUV(r.puck.x, r.puck.y);
    check('L1 uv inside unit square', lu > 0.2 && lu < 0.26 && lv > 0.8 && lv < 0.9, [lu, lv]);

    // L2) 인식 해상도 변경 (400px) 후에도 동일 위치 인식
    vision.setProcWidth(400);
    r = vision.process(scene, settings);
    const scale = 400 / 640;
    check('L2 higher resolution tracks same spot', vision.PH === 300 && r.puck && Math.abs(r.puck.x - 150 * scale) < 2 && Math.abs(r.puck.y - 400 * scale) < 2, r.puck && [vision.PW, vision.PH, r.puck.x, r.puck.y]);
    vision.setProcWidth(240);
    settings.floorMode = 'auto'; settings.puckModel = { r: 0, g: 0, b: 0, area: 0 };

    // ===== 아케이드 서바이벌 =====
    const fakePuck = (x, y, state = 'tracked') => ({ pos: state === 'lost' ? null : { x, y }, state, trail: [], distance: 0, speed: 0, touches: 0 });
    const mk = () => { const ar = new Arcade(null); ar.aspect = 0.5625; ar.start(fakePuck(0.5, 0.5), 'normal'); ar.spawnTimer = 1e9; ar.pickupTimer = 1e9; return ar; };
    const toPlay = (ar, t) => { for (let i = 0; i < 100; i++) { ar.update(0.033, fakePuck(0.5, 0.5), t); t += 33; } return t; };
    const stepTo = (ar, puckU, puckV, t, frames) => { for (let i = 0; i < frames; i++) { ar.update(0.033, fakePuck(puckU, puckV), t); t += 33; } return t; };
    const zoneY = (ar, v) => ar.zoneTop + v * ar.zoneH;

    // A1) 헤드업 카운트다운: 원 밖에 있으면 시작 안 됨, 원 안에 3초 정지하면 시작
    let ar = mk(); let t = 10000;
    for (let i = 0; i < 100; i++) { ar.update(0.033, fakePuck(0.1, 0.5), t); t += 33; }
    check('A1 countdown waits while puck outside circle', ar.phase === 'countdown' && ar.hold === 0);
    for (let i = 0; i < 60; i++) { ar.update(0.033, fakePuck(0.5, 0.5), t); t += 33; }
    check('A1 countdown accumulates inside circle', ar.phase === 'countdown' && ar.hold > 1.5, ar.hold);
    ar.update(0.033, fakePuck(0.1, 0.5), t); t += 33;
    check('A1 leaving circle resets hold', ar.hold === 0);
    t = toPlay(ar, t);
    check('A1 play starts after 3s hold', ar.phase === 'play');

    // A2) 수비수 충돌 -> 하트 -1, 1.5초 무적 동안 추가 피격 없음, 콤보 초기화
    ar = mk(); t = toPlay(ar, 20000); ar.combo = 7;
    ar.obstacles.push({ type: 'blocker', x: 0.5, y: 0.1, w: 0.15, h: 0.08, vy: 0.5 });
    t = stepTo(ar, 0.5, 0.5, t, 40); // 1.3초: 블록이 아바타(y≈0.478)를 통과
    check('A2 blocker hit costs a life and resets combo', ar.lives === 2 && ar.hits === 1 && ar.combo === 0, { lives: ar.lives, hits: ar.hits });
    ar.obstacles.push({ type: 'blocker', x: 0.5, y: zoneY(ar, 0.5) - 0.05, w: 0.15, h: 0.08, vy: 0.5 });
    t = stepTo(ar, 0.5, 0.5, t, 6); // 무적 중
    check('A2 invulnerable right after hit', ar.lives === 2);

    // A3) 통과 +50, 콤보 +1 / A4) 아슬아슬 회피 DEKE +100
    ar = mk(); t = toPlay(ar, 30000); const s0 = ar.score;
    ar.obstacles.push({ type: 'blocker', x: 0.15, y: 0.1, w: 0.15, h: 0.08, vy: 0.5 });
    t = stepTo(ar, 0.5, 0.5, t, 45);
    check('A3 passing obstacle gives +50 and combo', ar.passed === 1 && ar.combo === 1 && ar.score - s0 >= 50 && ar.dekes === 0, { score: ar.score - s0, combo: ar.combo });
    const s1 = ar.score;
    // 블록 오른쪽 모서리가 아바타에서 반지름+마진 안쪽을 스치게 배치 (margin = 0.15*0.08 = 0.012)
    ar.obstacles.push({ type: 'blocker', x: 0.5 - 0.075 - PUCK_R - 0.008, y: 0.1, w: 0.15, h: 0.08, vy: 0.5 });
    t = stepTo(ar, 0.5, 0.5, t, 45);
    check('A4 near miss awards DEKE +100', ar.dekes === 1 && ar.passed === 2 && ar.score - s1 >= 150, { dekes: ar.dekes, score: ar.score - s1 });

    // A5) 황금 퍽 +200
    ar = mk(); t = toPlay(ar, 40000); const s2 = ar.score;
    ar.pickups.push({ x: 0.5, y: zoneY(ar, 0.5) - 0.01, r: 0.028, vy: 0.001, born: t });
    t = stepTo(ar, 0.5, 0.5, t, 2);
    check('A5 gold puck +200 and combo', ar.items === 1 && ar.combo === 1 && ar.score - s2 >= 200, { items: ar.items, score: ar.score - s2 });

    // A6) 콤보 배율 & FEVER 회복
    ar = mk(); t = toPlay(ar, 50000);
    ar.combo = 4; ar._combo(t); check('A6 5 combo = x1.5', ar.multiplier === 1.5);
    ar.combo = 9; ar._combo(t); check('A6 10 combo = x2', ar.multiplier === 2);
    ar.lives = 2; ar.combo = 19; ar._combo(t);
    check('A6 20 combo = FEVER x3 and heals a heart', ar.multiplier === 3 && ar.lives === 3, { lives: ar.lives });
    ar.lives = 3; ar.combo = 39; ar._combo(t); check('A6 heal capped at 3 hearts', ar.lives === 3);
    const s3 = ar.score; ar._addScore(50); check('A6 multiplier applies to points', ar.score - s3 === 150);

    // A7) 스윕 빔: 가까운 띠(near)에 있으면 피격, 몸쪽(far)으로 당기면 통과
    ar = mk(); t = toPlay(ar, 60000);
    ar.obstacles.push({ type: 'beam', band: 'near', state: 'warn', t: 0, warn: 0.9, sweep: 1.3, x: 0, dir: 1, w: 0.016, h: ar.zoneH / 2, y: 0, done: false });
    t = stepTo(ar, 0.5, 0.8, t, 20);
    check('A7 beam warns before firing (no hit yet)', ar.lives === 3 && ar.obstacles[0].state === 'warn');
    t = stepTo(ar, 0.5, 0.8, t, 60);
    check('A7 beam hits puck left in near band', ar.lives === 2 && ar.obstacles.length === 0, { lives: ar.lives });
    ar.invulnUntil = 0;
    ar.obstacles.push({ type: 'beam', band: 'near', state: 'warn', t: 0, warn: 0.9, sweep: 1.3, x: 0, dir: 1, w: 0.016, h: ar.zoneH / 2, y: 0, done: false });
    const p0 = ar.passed;
    t = stepTo(ar, 0.5, 0.2, t, 80); // 토 드래그: 몸쪽(위쪽 띠)으로 당김
    check('A7 toe drag dodges beam (+pass)', ar.lives === 2 && ar.passed === p0 + 1, { passed: ar.passed });

    // A8) 좁은 틈새: 구멍 위치에 있으면 통과, 아니면 피격
    ar = mk(); t = toPlay(ar, 70000);
    ar.obstacles.push({ type: 'gap', x: 0.5, y: 0.05, w: 1, h: 0.05, vy: 0.5, holeX: 0.5, hole: 2 * PUCK_R * 2 });
    t = stepTo(ar, 0.5, 0.5, t, 45);
    check('A8 gap passed through the hole', ar.lives === 3 && ar.passed === 1, { lives: ar.lives, passed: ar.passed });
    ar.obstacles.push({ type: 'gap', x: 0.5, y: 0.05, w: 1, h: 0.05, vy: 0.5, holeX: 0.2, hole: 2 * PUCK_R * 2 });
    t = stepTo(ar, 0.5, 0.5, t, 45);
    check('A8 gap wall hits when off the hole', ar.lives === 2, { lives: ar.lives });

    // A9) 추적 끊김: 0.6초 넘으면 일시정지, 복귀 시 재개. 짧은 끊김(예측)은 피격 판정 없음
    ar = mk(); t = toPlay(ar, 80000);
    const e0 = ar.elapsed;
    for (let i = 0; i < 30; i++) { ar.update(0.033, fakePuck(0, 0, 'lost'), t); t += 33; }
    check('A9 paused after losing puck', ar.paused && ar.elapsed - e0 < 0.7, { paused: ar.paused, d: ar.elapsed - e0 });
    t = stepTo(ar, 0.5, 0.5, t, 3);
    check('A9 resumes when puck returns', !ar.paused);
    ar.obstacles.push({ type: 'blocker', x: 0.5, y: zoneY(ar, 0.5) - 0.03, w: 0.15, h: 0.08, vy: 0.5 });
    ar.update(0.033, { pos: { x: 0.5, y: 0.5 }, state: 'predicted', trail: [], distance: 0, speed: 0 }, t); t += 33;
    check('A9 no hit while position is predicted (occlusion buffer)', ar.lives === 3);

    // A10) 생존 점수, 레벨 진행, 결과 리포트
    ar = mk(); t = toPlay(ar, 90000);
    t = stepTo(ar, 0.5, 0.5, t, 92); // ≈3초
    check('A10 survival +10/s', ar.score >= 30 && ar.score < 50, ar.score);
    ar.score = 2050; ar.update(0.033, fakePuck(0.5, 0.5), t); t += 33;
    check('A10 level/speed progression', ar.level === 2 && Math.abs(ar.speedMul - 1.21) < 0.01, { level: ar.level, speedMul: ar.speedMul });
    ar.floorWidthM = 2; const res = ar.result({ distance: 3.5 });
    check('A10 result report fields', res.items_.length === 8 && res.distanceM === 7 && res.items_.some(([k]) => k === '최고 콤보'), res.items_);
    // 자동 스폰이 4종을 모두 만들어내는지
    ar = mk(); t = toPlay(ar, 100000); ar.spawnTimer = 0; const types = new Set();
    for (let i = 0; i < 400; i++) { ar.update(0.033, fakePuck(0.05, 0.05), t); t += 33; ar.obstacles.forEach((o) => types.add(o.type)); ar.invulnUntil = t + 1e6; ar.lives = 3; if (ar.spawnTimer > 0.2) ar.spawnTimer = 0.2; }
    check('A10 spawner produces all 4 obstacle types', ['blocker', 'gate', 'beam', 'gap'].every((k) => types.has(k)), [...types]);

    // ===== 휴대폰 거치대 플레이 =====
    // P1) 핸즈프리 시작: 카운트다운 생략하고 바로 플레이
    ar = mk(); ar.start(fakePuck(0.5, 0.5), 'normal', true);
    check('P1 hands-free start skips countdown', ar.phase === 'play' && ar.instruction === 'GO!');
    // P2) 세로 화면(9:16)에서는 낙하 속도를 높여 체감 시간이 같도록
    const land = new Arcade(null); land.aspect = 0.5625; land.start(fakePuck(0.5, 0.5), 'normal', true); land.pickupTimer = 1e9; land.spawnTimer = 0;
    const port = new Arcade(null); port.aspect = 1.78; port.start(fakePuck(0.5, 0.5), 'normal', true); port.pickupTimer = 1e9; port.spawnTimer = 0;
    land.update(0.033, fakePuck(0.05, 0.05), 1000); port.update(0.033, fakePuck(0.05, 0.05), 1000);
    const vl = land.obstacles.find((o) => o.type !== 'beam')?.vy, vp = port.obstacles.find((o) => o.type !== 'beam')?.vy;
    check('P2 portrait fall speed scaled (x2 cap)', port.fallScale === 2 && land.fallScale === 1 && (!vl || !vp || Math.abs(vp / vl - 2) < 0.3), { vl, vp, fs: port.fallScale });

    // 9) 성능: 240x180 프레임 처리 시간
    settings.debug = true;
    const t0 = performance.now();
    for (let i = 0; i < 60; i++) vision.process(scene, settings);
    const ms = (performance.now() - t0) / 60;
    out.logs.push(`INFO avg process time ${ms.toFixed(2)} ms/frame (debug on)`);
    check('debug image built', !!vision.debugImage);
    return out;
  };
</script>
